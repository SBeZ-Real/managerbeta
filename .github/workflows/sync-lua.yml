name: Sync public Lua source from Spaceify

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and validate source
        run: |
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 8 --max-time 45 "https://anymanager.spcfy.eu/client/source" --output /tmp/any-source.lua
          test "$(wc -c </tmp/any-source.lua)" -gt 10000
          test "$(wc -c </tmp/any-source.lua)" -lt 500000
          grep -q 'local Env = getgenv' /tmp/any-source.lua
          grep -q 'local ApiRoot = "https://anymanager.spcfy.eu"' /tmp/any-source.lua
          if cmp -s Script/source.lua /tmp/any-source.lua; then exit 0; fi
          cp /tmp/any-source.lua Script/source.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Script/source.lua
          git commit -m "Sync public keyless Any Premium Managers source"
          git push origin HEAD:main
